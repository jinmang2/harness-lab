# DSH `minimal` preset rebuilt for the headless profile.
#
# Headless has no preset roster: its agent uses the base composition's model-facing
# rows directly (roughly `standard`). This patch disables those rows (the same list
# the web-app bundle disables before mounting presets) and inserts what
# presets/minimal/agent.cordis.yml mounts: a complete one-line persona and one
# persistent bash tool.

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

# Headless already owns the deployment persona through the `system-prompt` service, so a
# second persona plugin collides. Configure that service instead: the one-line prefix,
# no suffix, no harness identity, no runtime-context snapshots (= persona `complete`).
- id: system-prompt
  config:
    personaPrefix: You are a helpful software engineer assistant.
    personaSuffix: ''
    includeHarnessIdentity: false
    includeRuntimeContext: false

- insert:
    - id: lab-minimal-shell
      name: cordis:group
      group: true
      isolate:
        terminals: true
      config:
        - id: pty
          name: '@deepseek-ai/dsh-terminal'
        - id: terminal-bash
          name: '@deepseek-ai/dsh-terminal-bash'
          config:
            timeoutMs: 300000
        - id: persistent-bash
          name: '@deepseek-ai/dsh-tool-bash-persistent'
          config:
            timeoutMs: 300000
            description: |-
              Run commands in a bash shell
              * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
              * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
              * State is persistent across command calls and discussions with the user.
              * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
              * Please avoid commands that may produce a very large amount of output.
              * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.
