# Week 1 assignment (All-About-Harness workspace/week1/README.md):
#   1. The in-class experiment question, Minimal vs Standard.
#   2. Find 3 questions where Minimal answers better than Standard.
# Run on both engines; the submission uses the DSH numbers (ADR-0011):
#   uv run lab run -T tasks/week1-assignment.yaml -e dsh,lab -H minimal,standard -n 3 -l week1 --judge
#   uv run lab week1 runs/<batch> --id <GitHub-ID>
# Candidates are questions a lean harness should handle at least as well: answer-only questions
# (no tool needed, so Standard's planning/tool prompt is pure overhead) and one small shell task.
# `expect` is a regex on the final answer; `rubric` feeds `lab judge`.
tasks:
  - id: seoul-weather
    prompt: 오늘 서울 날씨는 어땠어?
    tools: {allowed: [web, shell], required: true}
    rubric:
      - 실제로 오늘 서울 날씨를 조회했고 출처나 시각을 밝혔다 (추측하지 않았다)
      - 기온, 하늘 상태 등 구체적인 값을 담았다
      - 조회할 수 없었다면 그 사실을 분명히 말했다

  - id: sum-multiples
    prompt: 1부터 100까지 정수 중에서 3의 배수이면서 5의 배수가 아닌 수의 합은? 숫자로 답해줘.
    expect: "(^|[^0-9,])1,?368([^0-9,]|$)"
    tools: {allowed: [shell], required: false}
    rubric: [답이 1368로 정확하다, 군더더기 없이 답했다]

  - id: weekday
    prompt: 2026년 12월 25일은 무슨 요일이야? 요일만 답해줘.
    expect: "금요일|Friday"
    tools: {allowed: [shell], required: false}
    rubric: [금요일로 정확하다, 요일만 간결하게 답했다]

  - id: fahrenheit
    prompt: 화씨 98.6도는 섭씨 몇 도야? 숫자만 답해줘.
    expect: "(^|[^0-9.])37(\\.0+)?(?!\\.?[0-9])"
    tools: {allowed: [shell], required: false}
    rubric: [37도로 정확하다, 숫자만 답하라는 지시를 지켰다]

  - id: polite-rewrite
    prompt: "다음 문장을 뜻은 그대로 두고 존댓말 한 문장으로 바꿔줘: 내일 회의 10시로 옮겼으니까 늦지 마."
    tools: {allowed: [], required: false}
    rubric: [뜻(회의가 내일 10시로 옮겨짐, 늦지 말 것)이 그대로다, 자연스러운 존댓말이다, 한 문장이다]

  - id: tcp-udp
    prompt: TCP와 UDP의 차이를 딱 세 줄로 설명해줘.
    tools: {allowed: [], required: false}
    rubric: [정확히 세 줄이다, 연결 지향/신뢰성/속도 같은 핵심 차이가 정확하다, 불필요한 서론이 없다]

  - id: json-fix
    prompt: "다음 JSON의 문법 오류만 고친 결과를 코드 블록 하나로만 출력해줘: {'name': 'kim', 'tags': [1, 2,], 'ok': True}"
    expect: '"name"\s*:\s*"kim"'
    tools: {allowed: [], required: false}
    rubric: [유효한 JSON이다(큰따옴표, 끝 쉼표 제거, true 소문자), 값은 바꾸지 않았다, 코드 블록 하나만 출력했다]

  - id: count-files
    prompt: 이 폴더(하위 폴더 제외)에 .txt 파일이 몇 개 있어? 숫자만 답해줘.
    fixture: count-files
    expect: "^\\D*7\\s*개?\\D*$"
    tools: {allowed: [shell, read], required: true}
    rubric: [7개로 정확하다(하위 폴더 archive/는 제외), 숫자만 답했다]
