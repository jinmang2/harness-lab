# Study step 6 — delegation and human-in-the-loop.
#   uv run lab run -T tasks/delegation.yaml -H standard,delegate,hitl
#   LAB_HITL=reject uv run lab run -T tasks/delegation.yaml -H hitl     # what happens when every action is refused

tasks:
  - id: usd-orders
    prompt: |
      두 가지를 해줘.
      (a) 오늘의 원·달러 환율을 조회해서 기준 시각과 출처를 확인한다.
      (b) 아래 주문 데이터에서 `완료` 상태이고 금액·수량이 올바른 주문만 골라, 주문별 원화 매출과 (a)의 환율로 환산한 달러 매출을 orders_usd.csv로 저장하는 Python 프로그램을 작성하고 실행한다.
      마지막에 사용한 환율, 출처, orders_usd.csv 내용을 보여줘.

      ```csv
      order_id,customer,category,price,quantity,status,date
      A001,김민수,전자기기,120000,2,완료,2026-10-01
      A002,이지수,도서,18000,3,완료,2026-10-02
      A003,박준호,전자기기,85000,1,취소,2026-10-03
      A004,최서연,생활용품,abc,2,완료,2026-10-04
      A005,김민수,도서,22000,-1,완료,2026-10-05
      ```
    check: test -s orders_usd.csv && grep -q A001 orders_usd.csv && grep -q A002 orders_usd.csv && ! grep -qE 'A00[345]' orders_usd.csv
    tools: {allowed: [web, shell, read, write, delegate, skill], required: true}
    rubric:
      - 실제 조회한 환율과 출처, 기준 시각을 밝혔다
      - orders_usd.csv에 A001, A002만 들어 있고 금액이 맞다 (240,000원 / 54,000원)
      - 달러 환산이 사용한 환율과 일치한다

  - id: readme-structure
    fixture: mini-repo
    prompt: 이 repository를 분석해서 README.md에 `## Project Structure` 섹션을 추가해줘. 각 파일이 무슨 역할인지 한 줄씩 설명해줘. 작업 전에 테스트를 한 번 실행해서 통과하는지도 확인해줘.
    check: grep -q '^## Project Structure' README.md
    tools: {allowed: [shell, read, write, delegate], required: true}
    rubric:
      - 기존 README 내용을 보존하고 섹션만 추가했다
      - 모든 파일을 빠짐없이 정확히 설명했다
      - 테스트를 실제로 실행하고 결과를 보고했다
