[project]
name = "harness-lab"
version = "0.1.0"
description = "Same model, different harness: a lightweight lab for comparing agent harness compositions."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "deepagents==0.6.12",
    "langchain==1.4.2",
    "langgraph==1.2.12",
    "langchain-deepseek>=1.1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langfuse = ["langfuse>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
